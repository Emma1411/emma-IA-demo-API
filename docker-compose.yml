version: "3.8"

services:
  demo-emma-ai-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: demo-emma-ai-api

    ports:
      - "8002:8001"

    env_file:
      - .env

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - "com.emma.service=demo-emma-ai-api"
      - "com.emma.environment=production"
      - "com.emma.version=1.0.0"
